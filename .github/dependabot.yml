version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      # run these when most of our developers don't work, don't DoS our CI over the day
      time: "22:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      eslint:
        patterns:
          - "eslint*"
      esbuild:
        patterns:
          - "esbuild*"
      patternfly:
        patterns:
          - "@patternfly*"
      react:
        patterns:
          - "react*"
      stylelint:
        patterns:
          - "stylelint*"
      types:
        patterns:
          - "@types*"
          - "types*"

    ignore:
      # https://github.com/cockpit-project/cockpit/issues/21151
      - dependency-name: "sass"
        versions: [">=1.80.0", "2.x"]

      # needs to be done in Cockpit first
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]

      # PF5 requires React 18
      - dependency-name: "*react*"
        update-types: ["version-update:semver-major"]

      # The plugins we use didn't work with anything after 8 at some point
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # eslint-config-standard@17 peer-depends on eslint-plugin-promise@^6;
      # grouped with "eslint*" above, a major bump here breaks `npm install`
      # (ERESOLVE) before anything even gets to lint.
      - dependency-name: "eslint-plugin-promise"
        update-types: ["version-update:semver-major"]

      # @typescript-eslint/parser peer-requires typescript ">=4.8.4 <6.1.0".
      # The "types*" pattern in the types group below also incidentally
      # matches the bare "typescript" package name, so without this it gets
      # bumped alongside @typescript-eslint and breaks `npm install`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
